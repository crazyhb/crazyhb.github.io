  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <button class="mascot" id="btn-rules" type="button" aria-label="团团说规则">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path d="M32 15c0-6 4-10 10-11-1 6-4 10-10 11z" fill="#22a88f" />
              <path d="M32 15c0-5-3-8-8-9 0 5 3 8 8 9z" fill="#5fd6bb" />
              <ellipse cx="32" cy="37" rx="24" ry="22" fill="#ffb57a" />
              <ellipse cx="32" cy="35" rx="20" ry="18" fill="#ffd2a8" />
              <circle cx="24" cy="34" r="3.2" fill="#3b2418" />
              <circle cx="40" cy="34" r="3.2" fill="#3b2418" />
              <circle cx="25.2" cy="32.8" r="1" fill="#fff" />
              <circle cx="41.2" cy="32.8" r="1" fill="#fff" />
              <path d="M28 42c2.2 2.4 5.8 2.4 8 0" fill="none" stroke="#e85d3a" stroke-width="2.2" stroke-linecap="round" />
              <ellipse cx="20" cy="41" rx="4" ry="2.4" fill="#ff8d6a" opacity=".7" />
              <ellipse cx="44" cy="41" rx="4" ry="2.4" fill="#ff8d6a" opacity=".7" />
            </svg>
          </button>
          <div class="titles">
            <p class="eyebrow">团团入门</p>
            <h1>2×2 数独</h1>
          </div>
          <div class="clock">
            <small>用时</small>
            <strong id="hud-time">00:00</strong>
          </div>
        </div>
        <div class="hud">
          <span class="pill" id="hud-diff">简单</span>
          <span class="pill" id="hud-best">最快 --:--</span>
          <span class="pill" id="hud-mistakes">失误 0</span>
        </div>
      </header>

      <main class="board-wrap">
        <div id="board" class="board" role="grid" aria-label="团团 2×2 数独棋盘，4 行 4 列，分成四个 2×2 宫"></div>
      </main>

      <div class="pad" id="pad" role="group" aria-label="数字键盘"></div>

      <nav class="toolbar" aria-label="游戏操作">
        <button type="button" id="btn-new" class="primary-action">新局</button>
        <button type="button" id="btn-undo">撤销</button>
        <button type="button" id="btn-hint">提示</button>
        <button type="button" id="btn-diff">难度</button>
      </nav>

      <p class="status" id="status" aria-live="polite">团团：点空格，再点数字。</p>
    </div>

    <dialog class="sheet" id="dlg-rules">
      <form method="dialog" class="sheet-body">
        <h2>团团怎么玩</h2>
        <p>4×4 的棋盘分成四个 <strong>2×2 宫</strong>，就是颜色不一样的四块。</p>
        <div class="demo" aria-hidden="true">
          <div class="box tone-0"><span>1</span><span>2</span><span>3</span><span>4</span></div>
          <div class="box tone-1"><span>3</span><span>4</span><span>1</span><span>2</span></div>
          <div class="box tone-1"><span>2</span><span>1</span><span>4</span><span>3</span></div>
          <div class="box tone-0"><span>4</span><span>3</span><span>2</span><span>1</span></div>
        </div>
        <ul>
          <li>每一<strong>行</strong>填 1–4 各一次</li>
          <li>每一<strong>列</strong>填 1–4 各一次</li>
          <li>每个 <strong>2×2 宫</strong>填 1–4 各一次</li>
          <li>深色数字是线索，不能改；点空格再点数字</li>
        </ul>
        <p class="small">玩熟了？去挑战 <a href="../">团团 7×7</a>。</p>
        <button type="submit" class="primary" value="ok">团团知道了</button>
      </form>
    </dialog>

    <dialog class="sheet" id="dlg-diff">
      <form method="dialog" class="sheet-body">
        <h2>选难度</h2>
        <p>越难线索越少。之后点「新局」会沿用这个难度。</p>
        <div class="choice-row">
          <button type="submit" value="easy">简单</button>
          <button type="submit" value="medium">中等</button>
          <button type="submit" value="hard">困难</button>
        </div>
        <button type="submit" value="restart">重开本题</button>
        <button type="submit" class="ghost" value="cancel">取消</button>
      </form>
    </dialog>

    <dialog class="sheet" id="dlg-win">
      <div class="sheet-body">
        <div class="win-burst" aria-hidden="true"></div>
        <h2 id="win-title">团团鼓掌！</h2>
        <p id="win-copy">行、列、宫都齐了。</p>
        <dl class="stats" id="win-stats"></dl>
        <div class="choice-row two">
          <button type="button" class="primary" id="btn-next">下一盘</button>
          <button type="button" id="btn-win-close">看看棋盘</button>
        </div>
      </div>
    </dialog>

    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
